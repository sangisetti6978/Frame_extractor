version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: video_extractor_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-auto_frame_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - video_extractor_network

  mongodb:
    image: mongo:latest
    container_name: video_extractor_mongo
    restart: always
    environment:
      MONGO_INITDB_DATABASE: video_extractor
    volumes:
      - mongodb_data:/data/db
      - ./database/scripts:/docker-entrypoint-initdb.d
    networks:
      - video_extractor_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: video_extractor_backend
    restart: always
    depends_on:
      - postgres
      - mongodb
    environment:
      # Secrets should be injected via .env on the server
      DEBUG: 'False'
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      ALLOWED_HOSTS: '*' # Nginx will handle host filtering in production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-auto_frame_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      MONGODB_URI: 'mongodb://mongodb:27017/video_extractor'
      # Allow requests from the Nginx proxy (frontend container)
      CORS_ALLOWED_ORIGINS: 'http://frontend,https://frontend'
    volumes:
      # Map a persistent volume for processed media files
      - media_data:/app/media
    networks:
      - video_extractor_network
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn video_extractor.wsgi:application --bind 0.0.0.0:8000 --timeout 120"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Since we use Nginx proxying, API calls can just go to /api
        VITE_API_URL: '/api'
    container_name: video_extractor_frontend
    restart: always
    ports:
      # Expose standard HTTP port
      - "80:80"
    depends_on:
      - backend
    networks:
      - video_extractor_network

volumes:
  postgres_data:
  mongodb_data:
  media_data:

networks:
  video_extractor_network:
    driver: bridge
